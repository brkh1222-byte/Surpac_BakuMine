[project]
name = "bakumine"
version = "0.1.0"
description = "BakuMine Block Modeller: drillholes in, validated 3D block model out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "triangle>=20250106",
    "openpyxl>=3.1.5",
    "pyproj>=3.8.0",
    "xlrd>=2.0.2",
]

[project.scripts]
bakumine = "bakumine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "httpx",
    "trimesh>=5.2.1",
    "rtree>=1.4.1",
    "wellpathpy>=0.5.2",
    "gstools>=1.7.0",
    "pykrige>=1.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bakumine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
